<!doctype html><html lang="en" data-brand="github"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations Console</title>
<!-- THEME RESOLUTION: synchronous, before first paint. Never move this below the body. -->
<script>
(function(){var p=localStorage.getItem('theme')||'auto',
mq=window.matchMedia('(prefers-color-scheme: light)');
function r(){document.documentElement.dataset.theme=p==='auto'?(mq.matches?'light':'dark'):p;}
r();mq.addEventListener('change',function(){if(p==='auto')r();});
window.__theme={get pref(){return p;},set:function(v){p=v;localStorage.setItem('theme',v);r();
window.dispatchEvent(new CustomEvent('themechange'));},
cycle:function(){this.set({auto:'dark',dark:'light',light:'auto'}[p]);}};})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
<style>/* ---- core (tokens/reset/primitives) ---- */
/* uxui v2.1 core — tokens, reset, primitives. Shared by ALL archetype templates.
   Inline this into the single-file artifact. Component CSS below contains NO raw colors. */

:root{
  --gray-0:#ffffff;--gray-50:#f6f8fa;--gray-100:#eaeef2;--gray-200:#d0d7de;
  --gray-400:#8b949e;--gray-500:#6e7681;--gray-600:#59636e;--gray-700:#30363d;
  --gray-800:#21262d;--gray-850:#161b22;--gray-900:#0d1117;

  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-full:9999px;
  --transition-fast:150ms cubic-bezier(.4,0,.2,1);
  --transition-normal:250ms cubic-bezier(.4,0,.2,1);

  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;
  --text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:1.875rem;
}

/* Brand presets — per-preset contrast-checked ramps (NOT a single hue) */
:root,[data-brand="github"]{--brand-400:#58a6ff;--brand-600:#0969da;
  --brand-bg-d:rgba(88,166,255,.12);--brand-bg-l:rgba(9,105,218,.08);}
[data-brand="aurora"]{--brand-400:#b98cff;--brand-600:#6639ba;
  --brand-bg-d:rgba(185,140,255,.12);--brand-bg-l:rgba(102,57,186,.08);}
[data-brand="teal"]{--brand-400:#39c5bb;--brand-600:#0f766e;
  --brand-bg-d:rgba(57,197,187,.12);--brand-bg-l:rgba(15,118,110,.08);}
[data-brand="ember"]{--brand-400:#ff9457;--brand-600:#bc4c00;
  --brand-bg-d:rgba(255,148,87,.12);--brand-bg-l:rgba(188,76,0,.08);}
[data-brand="mono"]{--brand-400:#adbac7;--brand-600:#424a53;
  --brand-bg-d:rgba(173,186,199,.12);--brand-bg-l:rgba(66,74,83,.08);}

:root,[data-theme="dark"]{
  color-scheme:dark;
  --bg-primary:var(--gray-900);--bg-surface:var(--gray-850);--bg-elevated:#1c2128;
  --border-default:var(--gray-700);--border-muted:var(--gray-800);
  --border-accent:color-mix(in srgb,var(--brand-400) 40%,transparent);
  --text-primary:#e6edf3;--text-secondary:var(--gray-400);--text-tertiary:var(--gray-500);
  --color-accent:var(--brand-400);--accent-bg:var(--brand-bg-d);
  --color-success:#3fb950;--color-warning:#d29922;--color-danger:#f85149;
  --success-bg:rgba(63,185,80,.12);--warning-bg:rgba(210,153,34,.12);--danger-bg:rgba(248,81,73,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --sep:1px solid var(--border-default);   /* dark separates with BORDERS */
  --lift:none;
}
[data-theme="light"]{
  color-scheme:light;
  --bg-primary:var(--gray-50);--bg-surface:var(--gray-0);--bg-elevated:var(--gray-0);
  --border-default:var(--gray-200);--border-muted:var(--gray-100);
  --border-accent:color-mix(in srgb,var(--brand-600) 40%,transparent);
  --text-primary:#1f2328;--text-secondary:var(--gray-600);--text-tertiary:#6a737d;
  --color-accent:var(--brand-600);--accent-bg:var(--brand-bg-l);
  --color-success:#1a7f37;--color-warning:#9a6700;--color-danger:#cf222e;
  --success-bg:rgba(26,127,55,.08);--warning-bg:rgba(154,103,0,.08);--danger-bg:rgba(207,34,46,.08);
  --shadow-sm:0 1px 2px rgba(31,35,40,.06);--shadow-md:0 4px 12px rgba(31,35,40,.10);
  --shadow-lg:0 8px 24px rgba(31,35,40,.14);
  --sep:1px solid var(--border-muted);     /* light separates with SHADOWS */
  --lift:var(--shadow-sm);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);
  line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:var(--color-accent);text-decoration:none}
a:hover{text-decoration:underline}
:where(a[href],button,input,select,textarea,[tabindex]:not([tabindex^="-"])):focus-visible{
  outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--radius-sm);}

/* Type roles */
.eyebrow{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-tertiary);font-weight:600}
.title{font-size:var(--text-2xl);font-weight:600;letter-spacing:-.01em}
.deck{font-size:var(--text-lg);color:var(--text-secondary)}
.section{font-size:var(--text-base);font-weight:600}
.caption{font-size:var(--text-xs);color:var(--text-tertiary)}
.data-label{font-size:var(--text-sm);color:var(--text-secondary)}
.metric{font-size:var(--text-3xl);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.1}
.num{font-variant-numeric:tabular-nums}

/* Elevation 1 */
.card{background:var(--bg-surface);border:var(--sep);box-shadow:var(--lift);
  border-radius:var(--radius-lg);padding:var(--space-6);}
.card.compact{padding:var(--space-4)} .card.dense{padding:var(--space-3)}
.card.interactive{transition:background var(--transition-fast),border-color var(--transition-fast)}
.card.interactive:hover{background:var(--bg-elevated);border-color:var(--border-accent)}

/* Status — never color alone: always paired with an icon/label in markup */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--text-xs);
  font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-full)}
.badge.ok{background:var(--success-bg);color:var(--color-success)}
.badge.warn{background:var(--warning-bg);color:var(--color-warning)}
.badge.crit{background:var(--danger-bg);color:var(--color-danger)}
.badge.neutral{background:var(--accent-bg);color:var(--text-secondary)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:var(--text-xs);
  text-transform:uppercase;letter-spacing:.04em;padding:var(--space-2) var(--space-3);
  border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-surface)}
td{padding:var(--space-3);border-bottom:1px solid var(--border-muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{transition:background 100ms}
tbody tr:hover{background:var(--bg-elevated)}
.dense td{padding:var(--space-1) var(--space-3);height:28px}
.compact td{padding:var(--space-2) var(--space-3);height:36px}

/* Skeleton — fetched/live lifecycles ONLY */
.skeleton{background:linear-gradient(90deg,var(--bg-surface) 25%,var(--bg-elevated) 37%,var(--bg-surface) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--radius-md)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);
  padding:var(--space-10);color:var(--text-secondary);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

@media print{
  :root,[data-theme="dark"],[data-theme="light"]{
    --bg-primary:#fff;--bg-surface:#fff;--bg-elevated:#fff;
    --text-primary:#000;--text-secondary:#333;--text-tertiary:#555;
    --border-default:#bbb;--border-muted:#ddd;
    --shadow-sm:none;--shadow-md:none;--shadow-lg:none;--lift:none;}
  nav,.sidebar,.filters,.no-print{display:none!important}
  .card{break-inside:avoid;box-shadow:none;border:1px solid var(--border-default)}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:10px;color:#555}
  .printing>canvas,.printing>div:first-child{display:none}
}


/* ARCHETYPE: OPERATIONAL — exception-first. NO hero.
   TWO independent channels: importance = position/size (author-time),
   urgency = color/icon/badge (runtime, data-driven). Never collapse them.
   Geometry: fixed status rail + alert queue + telemetry + log. Mixed density BY REGION. */
.shell{display:grid;grid-template-columns:minmax(240px,300px) 1fr;
  grid-template-rows:auto 1fr;height:100vh;gap:var(--space-3);padding:var(--space-3)}
.topbar{grid-column:1/-1;display:flex;gap:var(--space-3);align-items:center}
.rail{display:flex;flex-direction:column;gap:var(--space-3);overflow:auto}
.main{display:grid;grid-template-rows:auto minmax(160px,22vh) 1fr;gap:var(--space-3);min-height:0}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--space-1)}
.tile{aspect-ratio:1;border-radius:var(--radius-sm);border:var(--sep);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-size:var(--text-xs);gap:2px}
.tile.ok{background:var(--bg-surface);color:var(--text-tertiary)}   /* healthy = QUIET */
.tile.warn{background:var(--warning-bg);color:var(--color-warning);border-color:var(--color-warning)}
.tile.crit{background:var(--danger-bg);color:var(--color-danger);border-color:var(--color-danger)}
.logpane{overflow:auto;font-family:var(--font-mono);font-size:var(--text-xs);min-height:0}
.stale{border-left:3px solid var(--color-warning);padding-left:var(--space-2)}
@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto}}

</style></head>
<body>
<!-- MANIFEST
artifact_class: operational
data_lifecycle: live
data_semantics: {missing: unknown, zero: measured-zero, stale_after: 120s, timezone: UTC}
provenance: {supplied: [], derived: [], assumptions: [], placeholder: []}
density: {controls: compact, tables: dense, alerts: comfortable}
overrides:
  - rule: one-hero-per-screen
    reason: exception scanning; importance and urgency are separate channels
-->
<div class="shell">
  <header class="topbar">
    <strong class="section">Console</strong>
    <span class="badge neutral"><i class="icon-clock" aria-hidden="true"></i>
      <span id="updated">—</span> UTC</span>
    <!-- Only render this if a REAL timestamp exists. No fake "last updated". -->
  </header>

  <aside class="rail">
    <!-- ALERT QUEUE: comfortable density, biggest hit targets — this is the action surface -->
    <div class="card"><div class="section">Active alerts</div>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:var(--space-2);
        margin-top:var(--space-3)">
        <li class="card compact interactive" style="display:flex;gap:var(--space-2)">
          <span class="badge crit"><i class="icon-alert-triangle" aria-hidden="true"></i> CRIT</span>
          <div><div class="data-label">service</div><div class="caption">since —</div></div>
        </li>
      </ul>
      <!-- filtered-empty state (reachable); no fake retry for live-but-healthy -->
    </div>
  </aside>

  <main class="main">
    <!-- STATUS GRID: color area intentionally exceeds any "10% budget" — it IS the encoding -->
    <div class="card compact"><div class="section">Service health</div>
      <div class="statusgrid" style="margin-top:var(--space-3)">
        <div class="tile ok"><i class="icon-check" aria-hidden="true"></i><span>svc</span></div>
      </div></div>

    <!-- TELEMETRY: step lines for state, no smoothing, gaps for missing -->
    <div class="card compact"><div id="latency" style="height:100%;min-height:140px"></div></div>

    <!-- LOG: dense -->
    <div class="card dense logpane">
      <table class="dense"><tbody><tr><td>—</td><td>—</td></tr></tbody></table></div>
  </main>
</div>
<script>/* ---- core JS ---- */
/* uxui v2.1 core JS — theme resolution goes in <head> (see theming.md).
   This file holds chart plumbing + print swap. Load with defer, after ECharts. */

const charts = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Robust alpha for any CSS color format the browser accepts (hex3/6, rgb, hsl, color-mix). */
const alpha = (c, a) => {
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.fillStyle = c;
  const h = ctx.fillStyle;
  if (h[0] === '#') {
    const n = parseInt(h.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }
  return h.replace(/rgba?\(([^)]+)\)/, (_, p) =>
    `rgba(${p.split(',').slice(0, 3).map(s => s.trim()).join(',')},${a})`);
};

const base = () => ({
  textStyle: { fontFamily: css('--font-sans'), color: css('--text-secondary') },
  grid: { left: 8, right: 8, top: 24, bottom: 8, containLabel: true },
  tooltip: { trigger: 'axis', backgroundColor: css('--bg-elevated'),
    borderColor: css('--border-default'),
    textStyle: { color: css('--text-primary'), fontSize: 12 },
    axisPointer: { type: 'line', lineStyle: { color: css('--border-default') } } },
  xAxis: { axisLine: { lineStyle: { color: css('--border-default') } }, axisTick: { show: false },
    splitLine: { show: false }, axisLabel: { color: css('--text-secondary'), fontSize: 12 } },
  yAxis: { axisLine: { show: false }, axisTick: { show: false },
    splitLine: { lineStyle: { color: css('--border-muted') } },
    axisLabel: { color: css('--text-secondary'), fontSize: 12 } }
});

/* smooth:false by default — smoothing invents values that were never measured.
   connectNulls:false — missing must render as a GAP, never bridged or zeroed. */
const lineSeries = (data, color, opts = {}) => ({
  type: 'line', data, smooth: false, showSymbol: false, connectNulls: false,
  lineStyle: { width: 2, color }, ...opts
});
const areaSeries = (data, color) => ({
  ...lineSeries(data, color),
  areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
    colorStops: [{ offset: 0, color: alpha(color, .25) }, { offset: 1, color: alpha(color, 0) }] } }
});
const stepSeries = (data, color) => ({ ...lineSeries(data, color), step: 'end' });
const barSeries = (data, color) => ({ type: 'bar', data, barMaxWidth: 28,
  itemStyle: { color, borderRadius: [4, 4, 0, 0] } });

/* One ResizeObserver for all charts — window listeners miss container-driven resizes. */
const ro = new ResizeObserver(es => es.forEach(e => e.target.__chart && e.target.__chart.resize()));
function mount(el, build) {
  const inst = echarts.init(el);
  el.__chart = inst;
  inst.setOption(build(), { notMerge: true });
  ro.observe(el);
  charts.push({ inst, build });
  return inst;
}

/* notMerge is REQUIRED: partial setOption leaves stale colors in series/legend/markLine. */
window.addEventListener('themechange', () =>
  charts.forEach(c => c.inst.setOption(c.build(), { notMerge: true })));

/* getDataURL only returns a string — swap a real <img> in for printing. */
window.addEventListener('beforeprint', () => charts.forEach(c => {
  const img = new Image();
  img.src = c.inst.getDataURL({ pixelRatio: 2, backgroundColor: '#fff' });
  img.className = 'print-chart'; img.style.width = '100%';
  c.inst.getDom().appendChild(img);
  c.inst.getDom().classList.add('printing');
}));
window.addEventListener('afterprint', () => document.querySelectorAll('.print-chart')
  .forEach(n => { n.parentElement.classList.remove('printing'); n.remove(); }));
</script>
</body></html>
