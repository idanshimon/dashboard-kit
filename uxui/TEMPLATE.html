<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.min.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>

<style>
:root {
  /* Backgrounds */
  --bg-primary: #0d1117;
  --bg-surface: #161b22;
  --bg-elevated: #1c2128;
  --bg-overlay: #2d333b;

  /* Borders */
  --border-default: #30363d;
  --border-muted: #21262d;
  --border-accent: rgba(88,166,255,0.4);

  /* Text */
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --text-link: #58a6ff;

  /* Semantic colors */
  --color-accent: #58a6ff;
  --color-success: #3fb950;
  --color-warning: #d29922;
  --color-danger: #f85149;
  --color-info: #58a6ff;
  --color-purple: #bc8cff;
  --color-pink: #f778ba;
  --color-orange: #d18616;

  /* Accent backgrounds (badges, highlights) */
  --accent-bg: rgba(88,166,255,0.1);
  --success-bg: rgba(63,185,80,0.1);
  --warning-bg: rgba(210,153,34,0.1);
  --danger-bg: rgba(248,81,73,0.1);

  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[x-cloak] { display: none !important; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Spinner */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

/* Layout */
.container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-4); }
.container-wide { max-width: 1440px; margin: 0 auto; padding: 0 var(--space-4); }
.grid { display: grid; gap: var(--space-4); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .hide-mobile { display: none; }
}
@media (min-width: 769px) and (max-width: 1024px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
}

/* Dashboard shell */
.dashboard { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
.dashboard-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--border-default);
  background: var(--bg-surface);
  position: sticky; top: 0; z-index: 100;
}
.dashboard-body { padding: var(--space-6); }

@media (max-width: 768px) {
  .dashboard-header { padding: var(--space-3) var(--space-4); }
  .dashboard-body { padding: var(--space-4); }
}

/* Card */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
}

/* Stat card */
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-6);
}
.stat-label { font-size: var(--text-sm); color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-2); }
.stat-value { font-size: var(--text-2xl); font-weight: 700; margin-top: var(--space-1); }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px 8px; border-radius: var(--radius-full);
  font-size: var(--text-xs); font-weight: 600;
}
.badge-success { background: var(--success-bg); color: var(--color-success); }
.badge-warning { background: var(--warning-bg); color: var(--color-warning); }
.badge-danger { background: var(--danger-bg); color: var(--color-danger); }
.badge-info { background: var(--accent-bg); color: var(--color-accent); }

/* Table */
.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table th {
  text-align: left; padding: var(--space-3) var(--space-4);
  background: var(--bg-elevated); color: var(--text-secondary);
  font-weight: 600; font-size: var(--text-xs);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-default);
}
.table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-muted); }
.table tr:hover td { background: rgba(88,166,255,0.04); }

/* Button */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 500; cursor: pointer;
  border: 1px solid var(--border-default); background: var(--bg-surface);
  color: var(--text-primary); transition: var(--transition-fast);
}
.btn:hover { background: var(--bg-elevated); border-color: var(--text-secondary); }
.btn-primary { background: var(--color-accent); color: var(--bg-primary); border-color: var(--color-accent); }
.btn-primary:hover { opacity: 0.9; }
.btn[disabled] { opacity: 0.6; cursor: not-allowed; }

/* Nav / Tabs */
.nav { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border-default); padding: 0 var(--space-4); }
.nav-item {
  padding: var(--space-3) var(--space-4); font-size: var(--text-sm);
  color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid transparent; transition: var(--transition-fast);
}
.nav-item:hover { color: var(--text-primary); }
.nav-item.active { color: var(--text-primary); border-bottom-color: var(--color-accent); }

/* Alert */
.alert {
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); display: flex; align-items: flex-start; gap: var(--space-3);
}
.alert-info { background: var(--accent-bg); border-left: 3px solid var(--color-accent); }
.alert-warning { background: var(--warning-bg); border-left: 3px solid var(--color-warning); }
.alert-danger { background: var(--danger-bg); border-left: 3px solid var(--color-danger); }
</style>
</head>
<body>
<div class="dashboard">
  <header class="dashboard-header">
    <div style="display:flex;align-items:center;gap:var(--space-3);">
      <i class="lucide-layout-dashboard" style="color:var(--color-accent);font-size:1.4rem;"></i>
      <h1 style="font-size:var(--text-lg);font-weight:600;">Page Title</h1>
    </div>
  </header>
  <main class="dashboard-body">
    <div class="container-wide">
      <!-- Your content here -->
    </div>
  </main>
</div>
</body>
</html>
